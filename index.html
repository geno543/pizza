<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Pizza Shop</h1>

    <div class="menu">
        <h2>Menu</h2>
        <div class="menu-items">
            <div class="item">
                <img src="images/pepperoni.jpg" alt="Pepperoni Pizza">
                <div class="item-details">Pepperoni Pizza - $10.99</div>
            </div>
            <div class="item">
                <img src="images/margherita.jpg" alt="Margherita Pizza">
                <div class="item-details">Margherita Pizza - $9.99</div>
            </div>
            <div class="item">
                <img src="images/hawaiian.jpg" alt="Hawaiian Pizza">
                <div class="item-details">Hawaiian Pizza - $11.99</div>
            </div>
            <div class="item">
                <img src="images/veggie.jpg" alt="Veggie Pizza">
                <div class="item-details">Veggie Pizza - $8.99</div>
            </div>
        </div>
    </div>

    <div class="about">
        <p>Visit us at: 123 Pizza Street</p>
        <p>Open: 10AM - 10PM</p>
    </div>
</body>
</html>
